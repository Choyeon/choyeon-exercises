<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_design.css"></head>
<body><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="right">📶 &nbsp; 🔋 100%</span></div>
  <div class="scroll"><div class="scroll-inner" style="padding-top:10px;">

    <div class="row between">
      <span style="font-size:24px;color:var(--t2);">‹</span>
      <span style="color:var(--t2);font-size:18px;">❤</span>
    </div>

    <div style="display:flex;gap:14px;align-items:center;margin-top:4px;">
      <div class="mring" style="width:72px;height:72px;font-size:32px;background:var(--m-chest);">🏋</div>
      <div style="flex:1;">
        <div class="title" style="font-size:20px;">Barbell Bench Press</div>
        <div class="muted" style="font-size:12px;">杠铃卧推</div>
      </div>
    </div>

    <div class="row gap8" style="flex-wrap:wrap;">
      <span class="mtag">胸</span><span class="mtag" style="background:rgba(251,146,60,.14);color:var(--m-upperArms);">三头</span><span class="mtag" style="background:rgba(52,211,153,.14);color:var(--m-shoulders);">肩</span><span class="mtag" style="background:rgba(138,146,166,.24);color:var(--t2);">杠铃</span><span class="mtag" style="background:rgba(255,106,61,.14);color:var(--accent);">增肌</span>
    </div>

    <!-- 动画播放 -->
    <div class="card" style="height:170px;border:1.5px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,rgba(255,106,61,.18),rgba(191,242,61,.08));">
      <div style="width:80px;height:80px;border-radius:50%;background:rgba(7,9,12,.5);display:flex;align-items:center;justify-content:center;color:var(--t1);font-size:30px;">▶</div>
      <span style="position:absolute;bottom:10px;right:12px;font-size:11px;color:var(--t2);font-weight:800;">▶ 播放动作演示</span>
    </div>

    <!-- 说明 -->
    <div class="sec-head"><span class="sec-idx">i</span><span class="sec-title">动作说明</span><span class="rule"></span></div>
    <div class="card" style="padding:14px;border:1.5px solid rgba(255,255,255,.28);">
      <div style="font-size:14px;line-height:22px;color:var(--t1);font-weight:500;">1. 躺在卧推凳上，双脚踩实地面，肩胛收紧下沉。<br>2. 正握杠铃，握距略宽于肩，将杠铃从架子上取下。<br>3. 缓慢下放至胸口，肘部约 45° 夹角。<br>4. 用力推起回到起始位置，保持核心收紧。</div>
    </div>

    <div class="card" style="padding:14px;border:1.5px solid rgba(255,255,255,.28);">
      <div class="row between"><span class="muted" style="font-size:12px;">目标肌群</span><span style="color:var(--t1);font-weight:800;">胸大肌 (主要)</span></div>
      <div class="row between" style="margin-top:8px;"><span class="muted" style="font-size:12px;">器械</span><span style="color:var(--t1);font-weight:800;">杠铃</span></div>
    </div>

    <div class="btn-primary" style="padding:16px;font-size:16px;letter-spacing:.5px;">＋ 加入训练</div>

  </div></div>

  <div class="tabbar">
    <div class="tab on"><span class="ic">🏠</span><span class="lb">首页</span><span class="pill"></span></div>
    <div class="tab"><span class="ic">📚</span><span class="lb">动作库</span></div>
    <div class="tab"><span class="ic">📋</span><span class="lb">训练</span></div>
    <div class="tab"><span class="ic">👤</span><span class="lb">我的</span></div>
  </div>
</div></body></html>
