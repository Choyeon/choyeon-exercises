<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_design.css"></head>
<body><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="right">📶 &nbsp; 🔋 100%</span></div>
  <div class="scroll"><div class="scroll-inner" style="padding-top:10px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 16px;">
      <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:30px;color:#07090C;font-weight:900;">超</div>
      <div style="font-size:20px;font-weight:900;color:var(--t1);">王超研</div>
      <div class="muted" style="font-size:12px;">坚持训练 12 天 · 累计 86 次</div>
    </div>

    <div style="display:flex;gap:12px;margin-bottom:16px;">
      <div class="card" style="flex:1;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:900;color:var(--primary);">86</div><div class="muted2" style="font-size:10px;font-weight:800;">总训练</div></div>
      <div class="card" style="flex:1;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:900;color:var(--t1);">11.2t</div><div class="muted2" style="font-size:10px;font-weight:800;">总容量</div></div>
      <div class="card" style="flex:1;padding:14px;text-align:center;"><div style="font-size:22px;font-weight:900;color:var(--info);">3</div><div class="muted2" style="font-size:10px;font-weight:800;">模板</div></div>
    </div>

    <div class="sec-head"><span class="sec-idx">⚙</span><span class="sec-title">偏好设置</span><span class="rule"></span></div>
    <div class="card" style="padding:4px 14px;border:1.5px solid rgba(255,255,255,.28);">
      <div class="row between" style="padding:12px 0;border-bottom:1px solid var(--divider);"><span style="color:var(--t1);font-weight:800;font-size:14px;">外观</span><span class="chip act" style="height:26px;padding:2px 10px;font-size:11px;">深色</span></div>
      <div class="row between" style="padding:12px 0;border-bottom:1px solid var(--divider);"><span style="color:var(--t1);font-weight:800;font-size:14px;">语言</span><span class="chip" style="height:26px;padding:2px 10px;font-size:11px;">简体中文</span></div>
      <div class="row between" style="padding:12px 0;border-bottom:1px solid var(--divider);"><span style="color:var(--t1);font-weight:800;font-size:14px;">单位</span><span class="chip" style="height:26px;padding:2px 10px;font-size:11px;">kg / cm</span></div>
      <div class="row between" style="padding:12px 0;"><span style="color:var(--t1);font-weight:800;font-size:14px;">每周目标</span><span class="chip" style="height:26px;padding:2px 10px;font-size:11px;">4 次</span></div>
    </div>

    <div class="sec-head"><span class="sec-idx">⬗</span><span class="sec-title">数据</span><span class="rule"></span></div>
    <div class="card" style="padding:4px 14px;border:1.5px solid rgba(255,255,255,.28);">
      <div class="row between" style="padding:12px 0;"><span style="color:var(--t1);font-weight:800;font-size:14px;">备份与恢复</span><span style="color:var(--t3);font-size:18px;">›</span></div>
    </div>

    <div class="card" style="padding:4px 14px;border:1.5px solid rgba(255,255,255,.28);margin-top:12px;">
      <div class="row between" style="padding:12px 0;"><span style="color:var(--t1);font-weight:800;font-size:14px;">关于 Choyeon Exercises</span><span style="color:var(--t3);font-size:18px;">›</span></div>
    </div>

  </div></div>

  <div class="tabbar">
    <div class="tab"><span class="ic">🏠</span><span class="lb">首页</span></div>
    <div class="tab"><span class="ic">📚</span><span class="lb">动作库</span></div>
    <div class="tab"><span class="ic">📋</span><span class="lb">训练</span></div>
    <div class="tab on"><span class="ic">👤</span><span class="lb">我的</span><span class="pill"></span></div>
  </div>
</div></body></html>
