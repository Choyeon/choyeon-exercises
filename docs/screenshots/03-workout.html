<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_design.css"></head>
<body><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="right">📶 &nbsp; 🔋 100%</span></div>
  <div class="scroll"><div class="scroll-inner" style="padding-top:10px;">

    <div class="row between">
      <span style="font-size:24px;color:var(--t2);">‹</span>
      <div style="text-align:center;flex:1;">
        <div class="title" style="font-size:18px;">杠铃卧推</div>
        <div class="muted" style="font-size:11px;font-weight:800;">第 3 / 8 组 · 胸 + 三头</div>
      </div>
      <span style="font-size:18px;color:var(--t2);">⋯</span>
    </div>

    <!-- 顶部统计条 -->
    <div style="display:flex;gap:8px;">
      <div class="card" style="flex:1;padding:10px;text-align:center;"><div class="green" style="font-size:18px;font-weight:900;">3/8</div><div class="muted2" style="font-size:10px;font-weight:800;">已完成</div></div>
      <div class="card" style="flex:1;padding:10px;text-align:center;"><div style="font-size:18px;font-weight:900;color:var(--t1);">1.44t</div><div class="muted2" style="font-size:10px;font-weight:800;">总容量</div></div>
      <div class="card" style="flex:1;padding:10px;text-align:center;"><div style="font-size:18px;font-weight:900;color:var(--t1);">32′</div><div class="muted2" style="font-size:10px;font-weight:800;">时长</div></div>
      <div class="card" style="flex:1;padding:10px;text-align:center;"><div class="info" style="font-size:18px;font-weight:900;">12</div><div class="muted2" style="font-size:10px;font-weight:800;">连击</div></div>
    </div>

    <!-- 休息计时 -->
    <div class="card" style="padding:18px;border:1.5px solid var(--accent-stroke);display:flex;flex-direction:column;align-items:center;gap:8px;">
      <div class="muted" style="font-size:11px;font-weight:800;letter-spacing:1px;">组间休息</div>
      <div style="font-size:40px;font-weight:900;color:var(--accent);letter-spacing:-1px;">00:45</div>
      <div class="row gap8">
        <div class="btn-primary" style="padding:10px 18px;font-size:12px;">跳过休息 ▶</div>
        <div class="btn-ghost" style="padding:10px 16px;font-size:12px;">+30s</div>
      </div>
    </div>

    <!-- 当前组输入 -->
    <div class="card" style="padding:14px;border:1.5px solid rgba(255,255,255,.28);">
      <div class="row between" style="margin-bottom:10px;"><span class="sec-title" style="font-size:15px;">第 3 组</span><span class="mtag">上次 8 × 60kg</span></div>
      <div style="display:flex;gap:12px;">
        <div style="flex:1;"><div class="muted2" style="font-size:10px;font-weight:800;margin-bottom:4px;">次数</div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;font-size:20px;font-weight:900;color:var(--t1);">8</div></div>
        <div style="flex:1;"><div class="muted2" style="font-size:10px;font-weight:800;margin-bottom:4px;">重量 (kg)</div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;font-size:20px;font-weight:900;color:var(--t1);">60</div></div>
      </div>
    </div>

    <!-- 已完成的组 -->
    <div style="font-size:12px;font-weight:800;color:var(--t2);margin:2px 4px;">已完成</div>
    <div class="card" style="padding:6px 12px;border:1.5px solid rgba(255,255,255,.28);">
      <div class="row between" style="padding:8px 0;border-bottom:1px solid var(--divider);"><span class="muted">第 1 组</span><span style="color:var(--t1);font-weight:800;">8 × 60 kg ✓</span></div>
      <div class="row between" style="padding:8px 0;border-bottom:1px solid var(--divider);"><span class="muted">第 2 组</span><span style="color:var(--t1);font-weight:800;">8 × 60 kg ✓</span></div>
      <div class="row between" style="padding:8px 0;"><span class="muted">第 3 组</span><span style="color:var(--t1);font-weight:800;">8 × 60 kg ✓</span></div>
    </div>

    <div class="btn-primary" style="padding:16px;font-size:16px;letter-spacing:.5px;margin-top:4px;">完成这组 ✓</div>

  </div></div>

  <div class="tabbar">
    <div class="tab"><span class="ic">🏠</span><span class="lb">首页</span></div>
    <div class="tab"><span class="ic">📚</span><span class="lb">动作库</span></div>
    <div class="tab on"><span class="ic">📋</span><span class="lb">训练</span><span class="pill"></span></div>
    <div class="tab"><span class="ic">👤</span><span class="lb">我的</span></div>
  </div>
</div></body></html>
