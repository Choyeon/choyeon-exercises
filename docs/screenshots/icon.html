<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html,body{margin:0;background:transparent;}
  #wrap{display:inline-block;}
  svg{display:block;}
</style>
<script>
  // ?fg=1 -> render figure only (transparent background) for adaptive foreground
  window.addEventListener('DOMContentLoaded', function(){
    var q = location.search;
    if (q.indexOf('fg=1') >= 0) {
      var bg = document.getElementById('bggroup');
      if (bg) bg.setAttribute('visibility','hidden');
    }
    if (q.indexOf('bg=1') >= 0) {
      var fg = document.getElementById('fig');
      var arc = document.getElementById('carc');
      if (fg) fg.setAttribute('visibility','hidden');
      if (arc) arc.setAttribute('visibility','hidden');
    }
    var m = q.match(/[?&]size=(\d+)/);
    if (m) {
      var svg = document.getElementById('icon');
      svg.setAttribute('width', m[1]);
      svg.setAttribute('height', m[1]);
    }
  });
</script>
</head>
<body>
<div id="wrap">
<svg id="icon" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- warm gradient matching the reference: orange -> coral/pink -> magenta -->
    <linearGradient id="warm" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%"  stop-color="#FF9A3D"/>
      <stop offset="48%" stop-color="#FF5C7A"/>
      <stop offset="100%" stop-color="#B14CE0"/>
    </linearGradient>
    <linearGradient id="warmArc" x1="0.0" y1="0.0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FF8A3D"/>
      <stop offset="60%" stop-color="#FF4D8E"/>
      <stop offset="100%" stop-color="#A24CE0"/>
    </linearGradient>
  </defs>

  <!-- background group: light off-white squircle + subtle border (hidden in fg mode) -->
  <g id="bggroup">
    <rect x="6" y="6" width="1012" height="1012" rx="236" ry="236" fill="#F2F2F4"/>
    <rect x="14" y="14" width="996" height="996" rx="228" ry="228" fill="none"
          stroke="#E2E2E8" stroke-width="5"/>
  </g>

  <!-- C-arc (implied C, opening to the right) -->
  <path id="carc" d="M 672 268 A 300 300 0 1 0 672 776"
        fill="none" stroke="url(#warmArc)"
        stroke-width="58" stroke-linecap="round"/>

  <!-- running figure (line-art, colored gradient) -->
  <g id="fig" transform="translate(-12,18)" fill="none" stroke="url(#warm)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <!-- head -->
    <circle cx="512" cy="346" r="46" fill="url(#warm)" stroke="none"/>
    <!-- torso -->
    <path d="M 512 388 L 544 502"/>
    <!-- front arm (bent, forward/up) -->
    <path d="M 514 404 L 598 402 L 640 338"/>
    <!-- back arm (swung back/down) -->
    <path d="M 514 404 L 442 458 L 394 522"/>
    <!-- front leg (knee up, forward) -->
    <path d="M 544 502 L 616 580 L 658 548"/>
    <!-- back leg (extended back/down) -->
    <path d="M 544 502 L 498 618 L 452 694"/>
  </g>
</svg>
</div>
</body>
</html>
