<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_design.css"></head>
<body><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="right">📶 &nbsp; 🔋 100%</span></div>
  <div class="scroll"><div class="scroll-inner" style="padding-top:10px;">

    <div class="title">热身</div>
    <div class="muted" style="font-size:12px;font-weight:700;margin-top:-6px;">训练前激活全身，降低受伤风险</div>

    <!-- 播放器 -->
    <div class="card" style="padding:16px;border:1.5px solid var(--accent-stroke);display:flex;align-items:center;gap:14px;">
      <div style="width:62px;height:62px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--warn));display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;">▶</div>
      <div style="flex:1;">
        <div style="font-size:16px;font-weight:900;color:var(--t1);">全身热身 · 8 项</div>
        <div class="muted" style="font-size:12px;">预计 6 分钟 · 循环播放</div>
        <div style="height:6px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden;"><div style="height:100%;width:12%;background:var(--accent);border-radius:3px;"></div></div>
      </div>
    </div>

    <div class="sec-head"><span class="sec-idx">▤</span><span class="sec-title">动作列表</span><span class="rule"></span></div>
    <div class="card" style="padding:4px 14px;border:1.5px solid rgba(255,255,255,.28);">
      <div class="row between" style="padding:11px 0;border-bottom:1px solid var(--divider);"><span class="row gap8"><span class="mring" style="width:30px;height:30px;font-size:13px;background:var(--m-upperLegs);">🦵</span><span style="color:var(--t1);font-weight:800;font-size:14px;">徒手浅蹲</span></span><span class="muted2" style="font-size:11px;">× 15</span></div>
      <div class="row between" style="padding:11px 0;border-bottom:1px solid var(--divider);"><span class="row gap8"><span class="mring" style="width:30px;height:30px;font-size:13px;background:var(--m-shoulders);">💪</span><span style="color:var(--t1);font-weight:800;font-size:14px;">手臂大绕环</span></span><span class="muted2" style="font-size:11px;">× 12</span></div>
      <div class="row between" style="padding:11px 0;border-bottom:1px solid var(--divider);"><span class="row gap8"><span class="mring" style="width:30px;height:30px;font-size:13px;background:var(--m-waist);">🔥</span><span style="color:var(--t1);font-weight:800;font-size:14px;">猫牛式脊柱激活</span></span><span class="muted2" style="font-size:11px;">× 10</span></div>
      <div class="row between" style="padding:11px 0;border-bottom:1px solid var(--divider);"><span class="row gap8"><span class="mring" style="width:30px;height:30px;font-size:13px;background:var(--m-lowerLegs);">🦶</span><span style="color:var(--t1);font-weight:800;font-size:14px;">髋关节环绕</span></span><span class="muted2" style="font-size:11px;">× 10</span></div>
      <div class="row between" style="padding:11px 0;"><span class="row gap8"><span class="mring" style="width:30px;height:30px;font-size:13px;background:var(--m-chest);">🏋</span><span style="color:var(--t1);font-weight:800;font-size:14px;">肩胛俯卧撑</span></span><span class="muted2" style="font-size:11px;">× 8</span></div>
    </div>

    <div class="btn-primary" style="margin-top:6px;padding:15px;font-size:15px;">开始热身 ▶</div>

  </div></div>

  <div class="tabbar">
    <div class="tab on"><span class="ic">🏠</span><span class="lb">首页</span><span class="pill"></span></div>
    <div class="tab"><span class="ic">📚</span><span class="lb">动作库</span></div>
    <div class="tab"><span class="ic">📋</span><span class="lb">训练</span></div>
    <div class="tab"><span class="ic">👤</span><span class="lb">我的</span></div>
  </div>
</div></body></html>
