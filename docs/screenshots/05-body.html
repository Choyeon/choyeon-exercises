<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_design.css"></head>
<body><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="right">📶 &nbsp; 🔋 100%</span></div>
  <div class="scroll"><div class="scroll-inner" style="padding-top:10px;">

    <div class="title">身体部位</div>

    <div class="card row" style="padding:14px;border:1.5px solid rgba(255,255,255,.28);">
      <div style="width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--m-shoulders),var(--m-back));display:flex;align-items:center;justify-content:center;font-size:24px;">🧍</div>
      <div style="flex:1;margin-left:12px;"><div style="font-size:15px;font-weight:900;color:var(--t1);">王超研</div><div class="muted" style="font-size:12px;">身高 178 · 体重 72.5 kg</div></div>
      <div class="btn-ghost" style="padding:8px 12px;font-size:11px;">编辑</div>
    </div>

    <!-- 录入区 -->
    <div class="card" style="padding:14px;border:1.5px solid rgba(255,255,255,.28);">
      <div class="row between" style="margin-bottom:10px;"><span class="sec-title" style="font-size:15px;">记录今日指标</span><span class="mtag">2026-11-09</span></div>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;"><div class="muted2" style="font-size:10px;font-weight:800;margin-bottom:4px;">体重 (kg)</div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;font-size:18px;font-weight:900;color:var(--t1);">72.5</div></div>
        <div style="flex:1;"><div class="muted2" style="font-size:10px;font-weight:800;margin-bottom:4px;">体脂 (%)</div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;font-size:18px;font-weight:900;color:var(--t1);">14.2</div></div>
        <div style="flex:1;"><div class="muted2" style="font-size:10px;font-weight:800;margin-bottom:4px;">肌肉 (kg)</div><div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;font-size:18px;font-weight:900;color:var(--t1);">34.1</div></div>
      </div>
      <div class="btn-primary" style="margin-top:12px;padding:12px;font-size:14px;">保存记录</div>
    </div>

    <!-- 历史 -->
    <div class="sec-head"><span class="sec-idx">▤</span><span class="sec-title">历史记录</span><span class="rule"></span></div>
    <div class="card" style="padding:4px 14px;border:1.5px solid rgba(255,255,255,.28);">
      <div class="row between" style="padding:10px 0;border-bottom:1px solid var(--divider);"><span class="muted">11-09</span><span style="color:var(--t1);font-weight:800;">72.5 kg · 14.2%</span></div>
      <div class="row between" style="padding:10px 0;border-bottom:1px solid var(--divider);"><span class="muted">11-02</span><span style="color:var(--t1);font-weight:800;">73.1 kg · 14.6%</span></div>
      <div class="row between" style="padding:10px 0;"><span class="muted">10-26</span><span style="color:var(--t1);font-weight:800;">73.8 kg · 15.1%</span></div>
    </div>

    <!-- 部位训练分布 -->
    <div class="sec-head"><span class="sec-idx">◑</span><span class="sec-title">部位训练分布</span><span class="rule"></span></div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;">
      <div class="card" style="width:calc(33.3% - 7px);padding:10px;border:1.5px solid rgba(255,255,255,.28);text-align:center;"><div class="mring" style="width:34px;height:34px;font-size:15px;margin:0 auto 6px;background:var(--m-chest);">🏋</div><div style="font-size:12px;font-weight:800;color:var(--t1);">胸</div><div class="muted2" style="font-size:10px;">18 次</div></div>
      <div class="card" style="width:calc(33.3% - 7px);padding:10px;border:1.5px solid rgba(255,255,255,.28);text-align:center;"><div class="mring" style="width:34px;height:34px;font-size:15px;margin:0 auto 6px;background:var(--m-back);">🏃</div><div style="font-size:12px;font-weight:800;color:var(--t1);">背</div><div class="muted2" style="font-size:10px;">22 次</div></div>
      <div class="card" style="width:calc(33.3% - 7px);padding:10px;border:1.5px solid rgba(255,255,255,.28);text-align:center;"><div class="mring" style="width:34px;height:34px;font-size:15px;margin:0 auto 6px;background:var(--m-upperLegs);">🦵</div><div style="font-size:12px;font-weight:800;color:var(--t1);">腿</div><div class="muted2" style="font-size:10px;">16 次</div></div>
    </div>

  </div></div>

  <div class="tabbar">
    <div class="tab on"><span class="ic">🏠</span><span class="lb">首页</span><span class="pill"></span></div>
    <div class="tab"><span class="ic">📚</span><span class="lb">动作库</span></div>
    <div class="tab"><span class="ic">📋</span><span class="lb">训练</span></div>
    <div class="tab"><span class="ic">👤</span><span class="lb">我的</span></div>
  </div>
</div></body></html>
